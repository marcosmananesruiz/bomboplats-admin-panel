server {
    listen 80;
    server_name _;

    # Redirige la raíz directamente a /admin/
    location = / {
        return 301 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing: cualquier subruta vuelve al index
        try_files $uri $uri/ /admin/index.html;
    }

    # Caché para assets estáticos
    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
} 
